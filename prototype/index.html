          <p class="small" style="font-size:15px">${s.note}</p>
          <span style="flex:1 1 auto"></span>
          ${i === st.picked ? `<p class="status good">${ic.ok}Chosen for this workshop</p>` : `<button class="btn btn-quiet" style="min-height:48px" data-act="pick" data-i="${i}">Choose this one</button>`}
        </article>`).join('')}</div>
        <div class="top">
          <button class="icon-btn" aria-label="Previous" data-act="slidePrev" ${st.idx === 0 ? 'disabled' : ''}>${ic.left}</button>
          <div class="dots" aria-hidden="true">${SLIDES.map((_, i) => `<span class="${i === st.idx ? 'on' : ''}"></span>`).join('')}</div>
          <button class="icon-btn" aria-label="Next" data-act="slideNext" ${st.idx === SLIDES.length - 1 ? 'disabled' : ''}>${ic.right}</button>
        </div>
      </section>
      ${picked ? `<p class="note"><strong>${esc(picked.words)}.</strong> We’ll show this on your lock screen until 10:00.</p>` : ''}`,
      footer: `<button class="btn btn-primary" data-go="checkin">Skip ahead to after the workshop</button>`
    };
  }

  function checkin() {
    const c = S.c, cause = CAUSES.find((x) => x.id === c.cause), isLate = c.outcome === 'late', mine = c.why === 'mine';
    let sug = '';
    if (isLate && mine && cause && !c.dismissed) {
      let title, body, label;
      if (cause.id === 'travel') { title = 'Travel ran over'; body = 'Travel times come live from Google Maps, so we won’t pad them. Want a bigger buffer for taxis on this route?'; label = 'Add a 5 min taxi buffer'; }
      else { title = cause.pattern ? 'This keeps happening' : cause.label + ' ran over'; body = (cause.pattern ? cause.pattern + ' ' : '') + `Add ${cause.mins} min to “${cause.label}” in your Workshop in Manchester preset?`; label = `Add ${cause.mins} min`; }
      sug = `<section class="card" aria-labelledby="sug-h" aria-live="polite">
        <div style="display:flex;gap:12px;align-items:flex-start"><span class="badge" style="width:40px;height:40px;border-radius:12px;color:var(--warn)">${ic.bulb}</span><div class="stack-sm"><h2 id="sug-h" style="font-size:17px;font-weight:700">${title}</h2><p style="font-size:15px;line-height:1.4;color:var(--soft)">${body}</p></div></div>
        ${c.accepted ? `<p class="status good" role="status">${ic.ok}${c.accepted === 'prep' ? 'Done. We’ll remind you at 21:00 the night before.' : 'Added. We’ll use it from your next trip.'}</p>`
          : `<div class="stack" style="gap:8px"><button class="btn btn-primary" data-act="accept">${label}</button>${cause.id === 'leave' ? '<button class="btn btn-outline" data-act="acceptPrep">Remind me to prep the night before</button>' : ''}<button class="btn-text" data-act="dismiss">Not now</button></div>`}
      </section>`;
    }
    const outcomes = [['early', 'Early', '<ellipse cx="12" cy="4.5" rx="6" ry="2"/><circle cx="12" cy="14" r="6.5"/><path d="M9.5 15.5a3.5 3.5 0 0 0 5 0M9.8 12h.01M14.2 12h.01"/>'], ['ontime', 'On time', '<path d="M20 6 9 17l-5-5"/>'], ['late', 'Late', '<path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/>']];
    const used = isLate && !mine ? 1 : 0;
    return {
      body: `
      <header class="stack">${backBtn('today', 'Today')}<div class="stack-sm"><p class="sub">Workshop in Manchester · started 10:00</p><h1 class="title">Were you on time?</h1></div></header>
      <div class="outcomes" role="group" aria-label="Arrival">${outcomes.map((o) => `<button aria-pressed="${c.outcome === o[0]}" data-act="outcome" data-k="${o[0]}">${I(o[2], 28)}${o[1]}</button>`).join('')}</div>
      ${isLate ? `
        <div class="calm"><p style="font-size:15px;line-height:1.45"><strong>That’s okay.</strong> One late trip doesn’t undo the good ones. Let’s see what we can learn from it.</p></div>
        <section class="stack" aria-labelledby="why-h"><h2 id="why-h" class="h2">Could it have been avoided?</h2>
          <div class="stack" role="group" aria-labelledby="why-h" style="gap:8px">
            <button class="opt" aria-pressed="${mine}" data-act="why" data-k="mine">${mine ? ic.tick : '<span style="width:16px"></span>'}Yes, it was down to my timing</button>
            <button class="opt" aria-pressed="${!mine}" data-act="why" data-k="other">${!mine ? ic.tick : '<span style="width:16px"></span>'}No, it was out of my control</button>
          </div></section>
        ${mine ? `<section class="stack" aria-labelledby="cause-h"><h2 id="cause-h" class="h2">Which step slowed you down?</h2><div class="wrap" role="group" aria-labelledby="cause-h">${CAUSES.map((x) => `<button class="pill" aria-pressed="${x.id === c.cause}" data-act="cause" data-k="${x.id}">${x.id === c.cause ? ic.tick : ''}${x.label}</button>`).join('')}</div></section>`
          : `<p class="card" role="status" style="flex-direction:row;align-items:center;gap:10px;padding:16px;font-size:15px;line-height:1.4"><span class="good">${ic.shield}</span><span>Some delays can’t be helped. This one counts towards your allowance, so we won’t change your plan.</span></p>`}`
        : `<p class="card" role="status" style="flex-direction:row;align-items:center;gap:10px;padding:16px;font-size:15px;line-height:1.4"><span class="good">${ic.ok}</span><span>${c.outcome === 'early' ? 'Nice. Arriving early is fine. Next time we can suggest something for the spare minutes.' : 'Great, you were on time. Your plan for this venue stays as it is.'}</span></p>`}
      ${sug}
      <section class="card" aria-labelledby="allow-h" style="gap:10px">
        <div class="top"><h2 id="allow-h" class="h2">This month</h2><span class="small">Goal: 9 in 10 on time</span></div>
        <p style="font-size:15px;line-height:1.45"><strong class="num">${isLate ? 8 : 9} of 9</strong> trips on time. Unavoidable delays allowed: <strong class="num">${used} of 1</strong> used.</p>
        <p class="small">Late now and then is normal. The aim is steady progress, not a perfect record.</p>
      </section>
      <section class="stack" aria-labelledby="feel-h"><h2 id="feel-h" class="h2">How did you feel when you arrived?</h2>
        <div class="feel" role="group" aria-labelledby="feel-h">${FEEL.map((f, i) => `<button aria-pressed="${c.feel === i + 1}" aria-label="${i + 1}, ${f}" data-act="feel" data-n="${i + 1}">${i + 1}</button>`).join('')}</div>
        <div aria-hidden="true" class="small" style="display:flex;justify-content:space-between;font-size:13px"><span>Calm</span><span>Very stressed</span></div>
      </section>`,
      footer: `<button class="btn btn-primary" data-act="finish">Done</button>`
    };
  }

  // ---------- calendar ----------
  function obReadyMins() { return CATS.filter((c) => c.phase === 'Getting ready').flatMap((c) => c.items).filter((it) => S.ob.sel[it[0]]).reduce((n, it) => n + it[2], 0); }
  // every step of a preset, getting ready first, so lead time and timeline always agree
  const DAYCARE_STEPS = [{ name: 'Pack up and leave work', mins: 5 }, { name: 'Drive to daycare', mins: 12 }, { name: 'Park and walk in', mins: 3 }, { name: '5 minutes to yourself', mins: 5, fixed: true }];
  function planSteps(k) {
    if (k === 'daycare') return DAYCARE_STEPS;
    const p = PRESETS[k] || presetFromOb(S.ob.name, '');
    return [{ name: 'Get ready', mins: p.max }, ...p.steps];
  }
  function leadFor(k) { return planSteps(k).reduce((n, x) => n + x.mins, 0); }
  function eventTimeline(k, start) {
    let t = start - leadFor(k);
    const rows = planSteps(k).map((x) => { const at = t; t += x.mins; return `<li><span class="small num" style="font-size:15px;padding-top:2px">${fmt(at)}</span><span class="dot${x.fixed ? ' seat' : ''}" aria-hidden="true">${x.fixed ? ic.seat : ''}</span><span class="stack-sm" style="gap:2px"><span style="font-weight:500">${x.fixed ? (k === 'daycare' ? 'There, with time to spare' : 'At your seat') : esc(x.name)}</span><span class="small">${x.fixed ? '5 min to settle' : dur(x.mins)}${x.legs ? ' · ' + x.legs.map((l) => esc(l[0])).join(', ') : ''}</span></span></li>`; }).join('');
    return `${rows}<li><span class="small num" style="font-size:15px;padding-top:2px;color:var(--fg);font-weight:700">${fmt(start)}</span><span class="dot" aria-hidden="true" style="border-color:var(--fg)"></span><span style="font-weight:700">Event starts</span></li>`;
  }
  // turn the stage picker's ticks into a preset the plan screen can use
  function presetFromOb(name, ev) {
    const mins = (ph) => CATS.filter((c) => c.phase === ph).flatMap((c) => c.items).filter((it) => S.ob.sel[it[0]]).reduce((n, it) => n + it[2], 0);
    const ready = mins('Getting ready'), leaving = mins('Leaving') || 5, arrive = mins('Arrival') || 5;
    return { label: name, event: ev, start: 600, min: Math.round((ready * 0.8) / 5) * 5, max: ready, steps: [
      { name: 'Leave the house', mins: leaving },
      { name: 'Travel', mins: 30, legs: [['Journey (live from Maps)', 30]] },
      { name: 'Arrive and find your spot', mins: arrive },
      { name: '5 minutes to yourself', mins: 5, fixed: true }] };
  }
  function presetLabel(k) { return k === 'default' ? S.ob.name : PRESET_NAMES[k]; }

  function calendar() {
    const st = S.cal;
    const planned = EVENTS.filter((e) => st.planned[e.id]).length;
    const dayEvents = EVENTS.filter((e) => e.day === st.day && (!st.onlyOpen || !st.planned[e.id]));
    const mode = st.mode || 'week', month = mode === 'month', d = DAYS[st.day];
    const modeLabel = { week: 'Week', month: 'Month', year: 'Year' }[mode];
    // year view: one tile per month; only late Oct and early Nov have synced events in the demo
    const monthEvents = (m) => EVENTS.filter((e) => (m === 9 ? e.day <= 1 : m === 10 ? e.day >= 2 : false));
    const yearGrid = `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].map((n, m) => {
      const evs = monthEvents(m), done = evs.filter((e) => st.planned[e.id]).length, past = m < 9;
      const inner = `<span style="font-weight:700;color:${past ? 'var(--muted)' : 'var(--fg)'}">${n}</span><span class="small" style="font-size:13px">${evs.length ? `${evs.length} events · ${done} planned` : past ? 'Past' : 'Nothing yet'}</span>${evs.length ? `<span class="bar" aria-hidden="true" style="height:4px;margin-top:4px"><span style="width:${Math.round(done / evs.length * 100)}%"></span></span>` : ''}`;
      return evs.length ? `<button class="card" data-act="calYearPick" data-n="${m}" style="padding:12px;gap:2px;text-align:left;min-height:84px;border:1.5px solid ${m === 10 ? 'var(--accent)' : 'transparent'}">${inner}</button>`
        : `<div class="card" style="padding:12px;gap:2px;min-height:84px;background:var(--bar)">${inner}</div>`;
    }).join('')}</div>`;
    // month grid, Monday first, 27 Oct to 30 Nov so the demo's Thu 30 Oct lines up; only the synced week (DAYS) carries events
    const cells = Array.from({ length: 35 }, (_, i) => { const dt = new Date(2025, 9, 27 + i); const n = dt.getDate(), m = dt.getMonth(); const idx = m === 9 ? (n === 30 ? 0 : n === 31 ? 1 : -1) : m === 10 && n <= 5 ? n + 1 : -1; return { n, m, idx }; });
    const dots = (i) => EVENTS.filter((e) => e.day === i).map((e) => st.planned[e.id] ? '<span style="width:6px;height:6px;border-radius:999px;background:var(--good)"></span>' : '<span style="width:6px;height:6px;border-radius:999px;border:1.5px solid var(--muted)"></span>').join('');
    const monthGrid = `<div class="card" style="padding:12px;gap:6px"><div aria-hidden="true" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:600;color:var(--muted)">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((x) => `<span>${x}</span>`).join('')}</div>
      <div role="group" aria-label="Choose a day in November" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">${cells.map((c) => {
        const on = c.idx === st.day, faded = c.m !== 10;
        const inner = `<span class="num" style="font-size:15px;font-weight:${c.idx >= 0 ? 700 : 500};color:${faded ? 'var(--muted)' : 'var(--fg)'}">${c.n}</span><span aria-hidden="true" style="display:flex;gap:2px;height:6px">${c.idx >= 0 ? dots(c.idx) : ''}</span>`;
        return c.idx >= 0 ? `<button aria-pressed="${on}" aria-label="${c.n} ${c.m === 9 ? 'October' : 'November'}, ${EVENTS.filter((e) => e.day === c.idx).length} events" data-act="calDay" data-n="${c.idx}" style="min-height:48px;border-radius:12px;border:1.5px solid ${on ? 'var(--accent)' : 'transparent'};background:${on ? 'var(--accent-soft)' : 'transparent'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">${inner}</button>`
          : `<span style="min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">${inner}</span>`;
      }).join('')}</div><p class="small" style="padding:4px 4px 0">Events sync a week ahead. Later dates fill in as they’re added to Outlook or Teams.</p></div>`;
    return { body: `
      <header class="stack">
        <div class="top" style="align-items:flex-end;position:relative"><div class="stack-sm"><p class="sub">${{ week: 'Next 7 days', month: 'November', year: 'At a glance' }[mode]}</p><h1 class="title">${{ week: 'Your week', month: 'Your month', year: 'Your year' }[mode]}</h1></div>
          <button class="chip" aria-haspopup="true" aria-expanded="${!!st.modeMenu}" aria-controls="mode-menu" aria-label="Calendar view: ${modeLabel}. Change view" data-act="calModeMenu" style="flex:0 0 auto">${ic.cal}${modeLabel}${(st.modeMenu ? ic.up : ic.down).replace(/width="20" height="20"/, 'width="16" height="16"')}</button>
          ${st.modeMenu ? `<div id="mode-menu" role="group" aria-label="Calendar view" style="position:absolute;right:0;top:calc(100% + 8px);z-index:8;width:180px;background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,0.5);display:flex;flex-direction:column;gap:4px">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([k, l]) => `<button aria-pressed="${mode === k}" data-act="calMode" data-k="${k}" style="min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-radius:12px;font-weight:${mode === k ? 700 : 500};border:1.5px solid ${mode === k ? 'var(--accent)' : 'transparent'};background:${mode === k ? 'var(--accent-soft)' : 'transparent'}">${l}${mode === k ? `<span style="color:var(--accent)">${ic.tick}</span>` : ''}</button>`).join('')}</div>` : ''}</div>
        <div class="inset" style="display:flex;align-items:center;gap:12px;padding:14px 16px">
          <div class="bar" style="flex:1 1 auto" aria-hidden="true"><span style="width:${Math.round(planned / EVENTS.length * 100)}%"></span></div>
          <span class="num" style="font-size:15px;font-weight:600">${planned} of ${EVENTS.length} planned</span>
        </div>
      </header>
      ${mode === 'year' ? yearGrid : month ? monthGrid : `<div role="group" aria-label="Choose a day" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">${DAYS.map((x, i) => {
        const evs = EVENTS.filter((e) => e.day === i), open = evs.filter((e) => !st.planned[e.id]).length, on = i === st.day;
        return `<button aria-pressed="${on}" aria-label="${x[0]} ${x[1]} ${MONTH(x[1])}, ${evs.length} events, ${open} not planned" data-act="calDay" data-n="${i}" style="min-height:72px;border-radius:16px;border:1.5px solid ${on ? 'var(--accent)' : 'transparent'};background:${on ? 'var(--accent-soft)' : 'var(--card)'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">
          <span style="font-size:12px;font-weight:600;color:var(--muted)">${x[0]}</span><span class="num" style="font-size:18px;font-weight:700">${x[1]}</span>
          <span aria-hidden="true" style="display:flex;gap:3px;height:8px;align-items:center">${evs.map((e) => st.planned[e.id] ? '<span style="width:6px;height:6px;border-radius:999px;background:var(--good)"></span>' : '<span style="width:6px;height:6px;border-radius:999px;border:1.5px solid var(--muted)"></span>').join('')}</span>
        </button>`; }).join('')}</div>`}
${mode === 'year' ? '' : `      <div class="top"><h2 class="h2">${d[2] ? d[2] + ', ' : ''}${d[0]} ${d[1]} ${MONTH(d[1])}</h2><button class="pill" style="min-height:44px;font-size:14px;padding:0 12px;white-space:nowrap;flex:0 0 auto" aria-pressed="${st.onlyOpen}" data-act="calOnly">${st.onlyOpen ? ic.tick : ''}Not planned</button></div>
      <ul class="stack" style="gap:10px">${dayEvents.length ? dayEvents.map((e) => {
        const pk = st.planned[e.id];
        return `<li><button class="link-card" data-act="calOpen" data-k="${e.id}" style="align-items:flex-start">
          <span class="num" style="flex:0 0 auto;width:48px;font-size:15px;font-weight:700;padding-top:2px">${fmt(e.start)}</span>
          <span class="stack-sm" style="flex:1 1 auto;gap:4px;min-width:0">
            <span style="font-weight:600">${esc(e.title)}${e.deadline ? ' (deadline)' : ''}</span>
            <span class="small">${esc(e.where)} · ${e.src}</span>
            ${pk ? `<span class="status good" style="font-size:14px">${ic.ok.replace(/width="20" height="20"/, 'width="16" height="16"')}Planned · ${e.deadline ? 'leave work by' : 'start getting ready at'} ${fmt(e.start - leadFor(pk))}</span>`
                 : `<span class="status" style="font-size:14px;color:var(--soft)">${I('<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>', 16, 2.2)}Not planned yet${e.isNew ? ' · new venue' : ''}</span>`}
          </span>
          <span style="color:var(--muted);padding-top:2px">${ic.chev}</span>
        </button></li>`; }).join('') : `<li class="card" style="align-items:center;text-align:center"><p class="sub">${st.onlyOpen ? 'Everything on this day is planned.' : 'Nothing on this day.'}</p></li>`}</ul>`}
      <button class="btn btn-dashed" data-act="quickAdd">${ic.plus}Add an event from a text message</button>
      <p class="small" style="text-align:center">Events come from Outlook and Teams. Only the ones you plan are saved.</p>` };
  }

  function event() {
    const st = S.cal, e = EVENTS.find((x) => x.id === st.open) || EVENTS[2];
    const pk = st.planned[e.id], d = DAYS[e.day];
    const keys = ['default', 'chester', 'manchester', 'night', ...S.custom];
    const pick = pk || st.pick, lead = leadFor(pick);
    return {
      body: `
      <header class="stack">${backBtn('calendar', 'Calendar')}
        <div class="stack-sm"><p class="sub">${d[0]} ${d[1]} ${MONTH(d[1])} · ${fmt(e.start)}</p><h1 class="title">${esc(e.title)}</h1><p class="sub">${esc(e.where)} · ${/^added/i.test(e.src) ? e.src.toLowerCase() : 'from ' + e.src}</p></div>
      </header>
      ${pk ? `<section class="card" aria-labelledby="pl-h">
          <p class="status good" id="pl-h" style="font-size:16px;font-weight:700">${ic.ok}Never Late plan added</p>
          <div class="inset stack-sm" style="padding:16px"><span class="sub">${e.deadline ? 'Leave work at' : 'Start getting ready at'}</span><span class="num" style="font-size:40px;font-weight:700;line-height:1">${fmt(e.start - lead)}</span><span class="sub">Using “${esc(presetLabel(pk))}” · ${e.deadline ? 'there' : 'at your seat'} by ${fmt(e.start - 5)}</span></div>
        </section>`
      : `<section class="card" aria-labelledby="add-h">
          <div class="stack-sm"><h2 id="add-h" class="h2">Add a Never Late plan</h2><p class="small">Pick a preset. You can fine-tune the steps afterwards.</p></div>
          <div class="wrap" role="group" aria-labelledby="add-h">${keys.map((k) => `<button class="pill" aria-pressed="${k === st.pick}" data-act="calPick" data-k="${k}">${k === st.pick ? ic.tick : ''}${esc(presetLabel(k))}</button>`).join('')}<button class="pill" style="border-style:dashed" data-act="newPreset" data-k="preset">${ic.plus}New preset</button><button class="pill" style="border-style:dashed" data-act="newPreset" data-k="bespoke">${ic.plus}Bespoke, just this once</button></div>
          <div class="inset stack-sm" style="padding:16px"><span class="sub">You’d start getting ready at</span><span class="num" aria-live="polite" style="font-size:40px;font-weight:700;line-height:1">${fmt(e.start - lead)}</span><span class="sub">at your seat by ${fmt(e.start - 5)} · travel from Google Maps for ${d[0]} at ${fmt(e.start - 60)}</span></div>
          ${e.isNew ? `<p class="note" style="display:flex;gap:8px;align-items:flex-start"><span style="color:var(--info);margin-top:2px">${ic.pin}</span><span>New venue. We’ll ask about parking, the entrance and the room the evening before.</span></p>` : ''}
          <button class="btn btn-primary" data-act="calAdd">Add plan</button>
        </section>`}
      <section class="stack" aria-labelledby="ev-tl"><div class="top"><h2 id="ev-tl" class="h2">Timeline</h2><span class="small">${pk ? esc(presetLabel(pk)) : 'Preview'}</span></div><ol class="tl card" style="padding:6px 16px;gap:0" aria-labelledby="ev-tl">${eventTimeline(pick, e.start)}</ol>${pk ? '<div style="display:flex;gap:10px"><button class="btn btn-quiet" style="flex:1 1 0" data-act="calCustom">Customise steps</button><button class="btn btn-outline" style="flex:1 1 0" data-act="calRemove">Remove plan</button></div>' : ''}</section>
      <section class="stack" aria-labelledby="ev-tools">
        <h2 id="ev-tools" class="h2">Before the day</h2>
        <button class="link-card" data-go="evening"><span class="badge" style="color:var(--info)">${ic.moon}</span><span class="stack-sm" style="flex:1 1 auto;gap:2px"><span style="font-weight:600">Evening-before prep</span><span class="small">Reminder at 21:00 the night before</span></span><span style="color:var(--muted)">${ic.chev}</span></button>
      </section>`
    };
  }

  // ---------- onboarding ----------
  const obProgress = (n) => `<div class="stack-sm" style="gap:8px"><p class="small" style="font-weight:600">Step ${n} of 3</p><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px" aria-hidden="true">${[1, 2, 3].map((i) => `<span style="height:4px;border-radius:4px;background:${i <= n ? 'var(--accent)' : 'var(--line)'}"></span>`).join('')}</div></div>`;
  const obChosen = () => CATS.map((c) => ({ ...c, chosen: c.items.filter((it) => S.ob.sel[it[0]]) }));

  function welcome() {
    return {
      body: `
      <div style="flex:1 1 auto"></div>
      <div class="stack" style="gap:20px">
        <span aria-hidden="true" style="width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">${I('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>', 34, 2.6)}</span>
        <h1 class="title" style="font-size:34px">Get there on time, without the rush</h1>
        <p class="sub" style="font-size:17px;line-height:1.5">Tell us your usual steps, from getting ready to arriving. You can change them any time.</p>
        <ul class="stack" style="gap:14px">
          <li style="display:flex;gap:12px;align-items:flex-start"><span class="badge" style="width:40px;height:40px;color:var(--accent)">${ic.list}</span><span class="stack-sm" style="gap:2px"><span style="font-weight:600">Pick your stages</span><span class="small">Wardrobe, self care, kids and pets, travel and arrival</span></span></li>
          <li style="display:flex;gap:12px;align-items:flex-start"><span class="badge" style="width:40px;height:40px;color:var(--accent)">${ic.timer}</span><span class="stack-sm" style="gap:2px"><span style="font-weight:600">Check the timings</span><span class="small">Rough guesses are fine. We learn your real times as you go</span></span></li>
          <li style="display:flex;gap:12px;align-items:flex-start"><span class="badge" style="width:40px;height:40px;color:var(--accent)">${ic.bell}</span><span class="stack-sm" style="gap:2px"><span style="font-weight:600">Get calm prompts</span><span class="small">An alarm or a nudge for each step, at the level you choose</span></span></li>
        </ul>
      </div>
      <div style="flex:1 1 auto"></div>`,
      footer: `<button class="btn btn-primary" data-go="stages">Build my routine</button><button class="btn-text" data-go="today" style="text-decoration:none">Skip for now</button>`
    };
  }

  function stages() {
    const cats = obChosen();
    const total = cats.reduce((n, c) => n + c.chosen.reduce((m, it) => m + it[2], 0), 0);
    const count = cats.reduce((n, c) => n + c.chosen.length, 0);
    return {
      body: `
      <header class="stack">${S.obMain ? backBtn(S.obFrom, 'Cancel') : backBtn('welcome', 'Back')}${obProgress(1)}
        <div class="stack-sm"><h1 class="title">${S.obMain ? (S.obKind === 'bespoke' ? 'Bespoke list' : 'New preset') : 'What’s in your routine?'}</h1><p class="sub">${S.obMain ? (S.obKind === 'bespoke' ? 'Tick the steps for this event only. It won’t be saved as a preset.' : 'Tick the steps this kind of trip needs. We’ve started you from your usual routine.') : 'Tick the steps you usually take, from getting ready to arriving. You can change these later.'}</p></div>
      </header>
      <div class="stack" style="gap:10px">${cats.map((c) => {
        const open = S.ob.open === c.id;
        return `<section class="card" style="padding:0;gap:0;overflow:hidden" aria-labelledby="cat-${c.id}">
          <h2 style="margin:0"><button id="cat-${c.id}" aria-expanded="${open}" aria-controls="list-${c.id}" data-act="obOpen" data-k="${c.id}" style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left">
            <span class="badge" style="width:40px;height:40px;color:var(--accent)">${ic[c.icon]}</span>
            <span class="stack-sm" style="flex:1 1 auto;gap:2px"><span style="font-size:17px;font-weight:700">${c.label}</span><span class="small">${c.chosen.length ? c.chosen.length + ' chosen' : (c.hint || 'None chosen')}</span></span>
            <span style="color:var(--muted)">${open ? ic.up : ic.down}</span>
          </button></h2>
          ${open ? `<ul id="list-${c.id}" style="padding:0 12px 12px;display:flex;flex-direction:column;gap:6px">${c.hint ? `<li class="small" style="padding:0 4px 4px">${c.hint}</li>` : ''}${c.items.map((it) => {
            const on = !!S.ob.sel[it[0]];
            return `<li><button class="check" style="min-height:56px;background:${on ? 'var(--accent-soft)' : 'var(--raised)'}" aria-pressed="${on}" data-act="obToggle" data-k="${it[0]}"><span class="box" aria-hidden="true">${on ? ic.tickDark.replace(/14/g, '18') : ''}</span><span class="lbl" style="font-size:16px;color:var(--fg)">${it[1]}</span><span class="state" aria-hidden="false">${it[2] ? it[2] + ' min' : 'from Maps'}</span></button></li>`;
          }).join('')}<li><button class="btn btn-dashed" style="width:100%;min-height:48px;font-size:15px" data-act="obOwn">${ic.plus}Add your own</button></li></ul>` : ''}
        </section>`;
      }).join('')}</div>`,
      footer: `<div style="display:flex;align-items:center;gap:14px"><div class="stack-sm" style="flex:1 1 auto;gap:2px"><span class="num" aria-live="polite" style="font-size:17px;font-weight:700">${count} stages</span><span class="small" style="font-size:13px">About ${dur(total)}, plus travel</span></div><button class="btn btn-primary" data-go="routine">Continue</button></div>`
    };
  }

  function routine() {
    const cats = obChosen();
    const phases = ['Getting ready', 'Leaving', 'Travel', 'Arrival'].map((ph) => {
      const items = cats.filter((c) => c.phase === ph).flatMap((c) => c.chosen);
      return { ph, items, mins: items.reduce((n, it) => n + it[2], 0) };
    });
    const ready = phases[0].mins, minReady = Math.round((ready * 0.8) / 5) * 5;
    return {
      body: `
      <header class="stack"><div class="top">${backBtn('stages', 'Back')}<button class="chip" data-act="obEdit" data-k="wardrobe">Edit steps</button></div>${obProgress(2)}
        <div class="stack-sm"><h1 class="title">${S.obMain ? (S.obKind === 'bespoke' ? 'Your bespoke list' : 'Your new preset') : 'Your routine'}</h1><p class="sub">Here’s how your stages fit into a trip. Timings are a starting point and get more accurate after a few trips.</p></div>
      </header>
      <section class="card" aria-labelledby="gr-h" style="gap:12px">
        <div class="top"><h2 id="gr-h" class="h2">Getting ready</h2><span class="num" style="font-weight:700">${dur(minReady)} to ${dur(ready)}</span></div>
        <p class="small">We’ll plan for ${dur(ready)}, so anything quicker is spare time.</p>
      </section>
      <ol class="stack" style="gap:10px">${phases.map((p, i) => `<li class="card" style="gap:10px;padding:16px 18px">
        <div class="top"><span style="display:flex;align-items:center;gap:10px"><span class="leg-n" aria-hidden="true">${i + 1}</span><span style="font-size:17px;font-weight:700">${p.ph}</span></span><span style="display:flex;align-items:center;gap:8px"><span class="small num">${p.ph === 'Travel' ? 'live from Maps' : dur(p.mins)}</span><button class="chip" style="min-height:44px;padding:0 14px" aria-label="Edit ${p.ph} steps" data-act="obEdit" data-k="${{ 'Getting ready': 'wardrobe', 'Leaving': 'home', 'Travel': 'travel', 'Arrival': 'arrive' }[p.ph]}">Edit</button></span></div>
        ${p.items.length ? `<ul class="stack" style="gap:0">${p.items.map((it) => `<li style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px"><span>${it[1]}</span><span class="small num">${it[2] ? it[2] + ' min' : ''}</span></li>`).join('')}</ul>` : `<p class="small">Nothing chosen yet</p>`}
      </li>`).join('')}
        <li class="card" style="gap:6px;padding:16px 18px;flex-direction:row;align-items:center"><span style="color:var(--accent)">${ic.seat.replace(/width="14" height="14"/, 'width="20" height="20"')}</span><span class="stack-sm" style="gap:2px"><span style="font-weight:700">At your seat 5 minutes early</span><span class="small">Always included, so you arrive settled</span></span></li>
      </ol>
      ${S.obKind === 'bespoke' ? '' : `<section class="stack" aria-labelledby="name-h">${obProgress(3)}<div class="field"><label id="name-h" for="ob-name">Preset name (tap to change)</label><input id="ob-name" value="${esc(S.ob.name)}" placeholder="e.g. School run"></div>${S.obMain ? '' : '<p class="small">You can make more presets later, like “Night out” or “School run”.</p>'}</section>`}`,
      footer: `<button class="btn btn-primary" data-act="obSave">${S.obMain ? (S.obKind === 'bespoke' ? 'Use for this event' : 'Save preset') : 'Save and start planning'}</button>`
    };
  }

  // ---------- render ----------
  const app = document.getElementById('app');
  let lastView = null;
  function render() {
    const v = S.view;
    const out = { calendar, event, welcome, stages, routine, today, alarm, plan, journey, leave, evening, lock, seat, checkin }[v]();
    const keepScroll = lastView === v ? (document.scrollingElement || document.documentElement).scrollTop : 0;
    const car = app.querySelector('#carousel'); const keepCar = lastView === v && car ? car.scrollLeft : null;
    const tabbar = TABS[v] ? `<nav class="tabbar" aria-label="Main">
      <button class="tab" data-go="today" ${TABS[v] === 'today' ? 'aria-current="page"' : ''}>${ic.clock}Today</button>
      <button class="tab" data-go="calendar" ${TABS[v] === 'calendar' ? 'aria-current="page"' : ''}>${ic.cal.replace('width="22" height="22"', 'width="24" height="24"')}Calendar</button>
      <button class="tab" data-go="plan" ${TABS[v] === 'plan' ? 'aria-current="page"' : ''}>${ic.list}Plans</button>
      <button class="tab" data-go="checkin" ${TABS[v] === 'checkin' ? 'aria-current="page"' : ''}>${ic.chart}History</button></nav>` : '';
    const lockish = out.cls === 'lock';
    app.style.setProperty('--tabh', TABS[v] ? '65px' : '0px');
    app.innerHTML = `<main class="view${lastView !== v ? ' enter' : ''}" style="${lockish ? 'gap:14px;padding-top:12px' : out.cls === 'alarm-view' ? 'gap:14px;padding-top:12px' : ''}">${out.body}</main>${out.footer ? `<div class="footer">${out.footer}</div>` : ''}${tabbar}${out.overlay || ''}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
    document.body.style.background = lockish ? '#08080A' : '';
    app.style.background = lockish ? '#08080A' : '';
    (document.scrollingElement || document.documentElement).scrollTop = keepScroll;
    const nc = app.querySelector('#carousel');
    if (nc) {
      if (keepCar !== null) nc.scrollLeft = keepCar;
      nc.addEventListener('scroll', () => {
        clearTimeout(nc._t);
        nc._t = setTimeout(() => { const w = nc.firstElementChild.getBoundingClientRect().width + 12; const i = Math.round(nc.scrollLeft / w); if (i !== S.seat.idx) { S.seat.idx = i; render(); } }, 120);
      });
    }
    if (lastView !== v) { const h = app.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
    lastView = v;
  }
  function scrollToSlide(i) {
    S.seat.idx = Math.max(0, Math.min(SLIDES.length - 1, i)); render();
    const nc = app.querySelector('#carousel'); if (nc) { const el = nc.children[S.seat.idx]; nc.scrollTo({ left: el.offsetLeft - 20 }); }
  }

  let toastTimer;
  function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2400); }
  function go(v) { S.view = v; if (location.hash.slice(1) !== v) { try { history.replaceState(null, '', '#' + v); } catch (e) {} } render(); }

  const acts = {
    subToggle: (d) => { S.subDone[d.k] = !S.subDone[d.k]; },
    obToggle: (d) => { S.ob.sel[d.k] = !S.ob.sel[d.k]; },
    calModeMenu: () => { S.cal.modeMenu = !S.cal.modeMenu; },
    calMode: (d) => { S.cal.mode = d.k; S.cal.modeMenu = false; },
    calYearPick: (d) => { S.cal.mode = 'month'; S.cal.day = +d.n === 9 ? 0 : 2; },
    calDay: (d) => { S.cal.day = +d.n; },
    calOnly: () => { S.cal.onlyOpen = !S.cal.onlyOpen; },
    calOpen: (d) => { S.cal.open = d.k; S.cal.pick = 'default'; go('event'); return false; },
    calPick: (d) => { S.cal.pick = d.k; },
    calAdd: () => { S.cal.planned[S.cal.open] = S.cal.pick; toast('Plan added'); },
    calRemove: () => { delete S.cal.planned[S.cal.open]; toast('Plan removed'); },
    calCustom: () => { const k = S.cal.planned[S.cal.open]; S.plan = fromPreset(PRESETS[k] ? k : 'chester'); go('plan'); return false; },
    obEdit: (d) => { S.ob.open = d.k; go('stages'); return false; },
    obOpen: (d) => { S.ob.open = S.ob.open === d.k ? '' : d.k; },
    obOwn: () => { toast('Type a stage name and how long it takes'); },
    newPreset: (d) => { S.obKind = d.k; S.obFrom = S.view; S.obMain = S.ob; S.ob = { sel: { ...S.ob.sel }, open: 'wardrobe', name: '' }; go('stages'); return false; },
    obSave: () => {
      if (S.obMain) {
        const one = S.obKind === 'bespoke', n = document.getElementById('ob-name');
        const name = one ? 'Bespoke list' : (n && n.value.trim()) || 'My preset ' + (S.custom.length + 1);
        const k = one ? 'b' + (++S.oneOffs) : 'c' + (S.custom.length + 1), ev = S.obFrom === 'plan' ? PRESETS[S.plan.preset].event : 'Your next event';
        PRESETS[k] = { ...presetFromOb(name, ev), oneOff: one }; PRESET_NAMES[k] = name;
        LEAD[k] = PRESETS[k].max + PRESETS[k].steps.reduce((m, x) => m + x.mins, 0);
        S.ob = S.obMain; S.obMain = null;
        if (!one) S.custom.push(k);
        if (S.obFrom === 'plan') S.plan = fromPreset(k); else if (one) S.cal.planned[S.cal.open] = k; else S.cal.pick = k;
        toast(one ? 'Bespoke list added to this event only' : `“${name}” added to your presets`); go(S.obFrom); return false;
      } const n = document.getElementById('ob-name'); if (n && n.value.trim()) S.ob.name = n.value.trim(); toast(`“${S.ob.name}” saved as your starter preset`); go('today'); return false; },
    liveStart: () => { S.live = Math.floor(Date.now() / 1000) * 1000; S.tx = {}; S.geo = null; S.openDone = {}; toast('Live demo started: getting ready now'); },
    liveStop: () => { S.live = null; S.tx = {}; S.geo = null; S.tmore = false; S.openDone = {}; },
    tMore: () => { S.tmore = !S.tmore; },
    geoSim: (d) => {
      const idx = +d.n, at = Date.now();
      S.geo = { idx, at, why: idx === 2 ? `Left home at ${clock(at)}` : `Near the venue at ${clock(at)}` };
      S.tmore = false;
      toast(idx === 2 ? 'You’ve left home. On to Travel.' : 'You’re near the venue. On to the walk in.');
    },
    tAdd: (d) => { const cur = todaySteps().find((x) => x.state === 'now'); if (!cur) return; S.tx[cur.i] = (S.tx[cur.i] || 0) + +d.n; S.tmore = false; const st = todaySteps(); toast(st.late ? `Added ${d.n} min · about ${st.late} min late` : `Added ${d.n} min · still on time`); },
    doneOpen: (d) => { S.openDone[d.n] = !S.openDone[d.n]; },
    levelMenu: () => { S.levelMenu = !S.levelMenu; },
    levelPick: (d) => { S.level = d.k; S.levelMenu = false; toast('Prompts set to ' + LEVELS.find((l) => l.id === d.k).label); },
    quickAdd: () => { toast('Paste a message to pull out the time and place'); },
    alarmOff: () => { toast('Alarm off. Your plan is still on Today.'); go('today'); return false; },
    snooze: () => { toast('Snoozed until 07:05'); go('today'); return false; },
    alarmMore: () => { S.j.sheet = true; go('journey'); return false; },
    preset: (d) => { S.plan = fromPreset(d.k); },
    minDown: () => { S.plan.min = Math.max(5, S.plan.min - 5); },
    minUp: () => { S.plan.min = Math.min(S.plan.max, S.plan.min + 5); },
    maxDown: () => { S.plan.max = Math.max(S.plan.min, S.plan.max - 5); },
    maxUp: () => { S.plan.max = Math.min(180, S.plan.max + 5); },
    addon: (d) => { S.plan.addons[d.k] = !S.plan.addons[d.k]; },
    legs: () => { S.plan.legsOpen = !S.plan.legsOpen; },
    up: (d) => { const s = S.plan.steps, i = +d.i; if (i > 0) [s[i - 1], s[i]] = [s[i], s[i - 1]]; },
    down: (d) => { const s = S.plan.steps, i = +d.i; if (i < s.length - 2) [s[i + 1], s[i]] = [s[i], s[i + 1]]; },
    rm: (d) => { S.plan.steps.splice(+d.i, 1); },
    addStep: () => { S.plan.added++; S.plan.steps.splice(Math.max(0, S.plan.steps.length - 1), 0, { name: 'New step ' + S.plan.added, mins: 5 }); },
    save: () => { toast('Plan saved'); go('today'); return false; },
    openSheet: () => { S.j.sheet = true; },
    closeSheet: () => { S.j.sheet = false; S.j.extra = 0; S.j.draft = false; },
    closeSheetBg: (d, e) => { if (e.target.classList.contains('scrim')) { S.j.sheet = false; S.j.extra = 0; S.j.draft = false; } else return false; },
    applyExtra: () => { S.j.sheet = false; toast(S.j.extra > 10 ? 'Plan updated · new seat time 10:10' : 'Plan updated · still on time'); },
    extra: (d) => { S.j.extra = +d.n; S.j.draft = false; },
    draft: () => { S.j.draft = !S.j.draft; },
    copy: () => { const t = document.getElementById('draft-text'); const txt = t ? t.textContent : ''; try { navigator.clipboard.writeText(txt).then(() => { toast('Message copied'); render(); }, () => {}); } catch (e) {} return false; },
    level: (d) => { S.level = d.k; },
    tick: (d) => { S.leave[d.k] = !S.leave[d.k]; },
    eve: (d) => { S.eve[d.k] = !S.eve[d.k]; },
    eveDone: () => { toast('Saved. Sleep well'); go('today'); return false; },
    left: () => { const missing = CHECKLIST.filter((c) => !S.leave[c.id]).length; if (missing) toast(`${missing} items unticked. We’ll check on the way`); go('lock'); return false; },
    lockMore: () => { S.lock.more = !S.lock.more; },
    lockExtra: (d) => { S.lock.extra = S.lock.extra === +d.n ? 0 : +d.n; },
    cycle: () => { const i = LEVELS.findIndex((l) => l.id === S.level); S.level = LEVELS[(i + 1) % 3].id; },
    pick: (d) => { S.seat.picked = +d.i; },
    slidePrev: () => { scrollToSlide(S.seat.idx - 1); return false; },
    slideNext: () => { scrollToSlide(S.seat.idx + 1); return false; },
    outcome: (d) => { S.c.outcome = d.k; S.c.accepted = ''; S.c.dismissed = false; },
    why: (d) => { S.c.why = d.k; S.c.accepted = ''; S.c.dismissed = false; },
    cause: (d) => { S.c.cause = d.k; S.c.accepted = ''; S.c.dismissed = false; },
    accept: () => { S.c.accepted = 'time'; },
    acceptPrep: () => { S.c.accepted = 'prep'; },
    dismiss: () => { S.c.dismissed = true; },
    feel: (d) => { S.c.feel = +d.n; },
    finish: () => { toast('Thanks. Check-in saved'); go('today'); return false; }
  };

  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-go],[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.go) { if (el.dataset.go !== 'journey') S.j.sheet = false; go(el.dataset.go); return; }
    const fn = acts[el.dataset.act];
    if (fn && fn(el.dataset, e) !== false) render();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.j.sheet) { acts.closeSheet(); render(); } });
  // live countdown: update numbers every second, re-render when a step changes
  let lastActive = null;
  setInterval(() => {
    const now = Date.now();
    if (S.view === 'journey') { document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = hms(+el.dataset.cd - now); }); return; }
    if (!S.live || S.view !== 'today') return;
    document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = mmss(+el.dataset.cd - now); });
    document.querySelectorAll('[data-bar]').forEach((el) => { const [a, b] = el.dataset.bar.split('|').map(Number); el.style.width = Math.min(100, ((now - a) / (b - a)) * 100) + '%'; });
    const act = todaySteps().findIndex((x) => x.state === 'now');
    if (lastActive !== null && act !== lastActive) { if (act >= 0) toast('Now: ' + TODAY_STEPS[act][0].split(' · ')[0]); render(); }
    lastActive = act;
  }, 1000);
  function fromHash() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : 'welcome'; render(); }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</html>
