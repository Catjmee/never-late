<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Never Late</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* One-column phone app: scrolling view + fixed bottom bar. Deliberately dark-only. Palette: Lagoon teal. */
:root {
  --bg: #101615;
  --card: #1A2220;
  --raised: #24302D;
  --bar: #131A19;
  --line: #2E3A37;
  --control: #788884;
  --fg: #E6ECEA;
  --muted: #A9B5B2;
  --soft: #CBD5D2;
  --accent: #5ED3C4;
  --accent-soft: #1D3A36;
  --on-accent: #082320;
  --good: #8FDCA4;
  --warn: #FFC27A;
  --info: #9CC2FF;
  --font: 'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.35; cursor: default; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
h1:focus { outline: none; }
h1, h2, p, ol, ul { margin: 0; }
ol, ul { list-style: none; padding: 0; }
h1, h2 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; position: relative; }
.view { flex: 1 0 auto; padding-block: 20px 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.view::-webkit-scrollbar { display: none; }
.view.enter { animation: slide 220ms ease-out; }
@keyframes slide { from { opacity: 0.4; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view.enter, .sheet, .toast { animation: none !important; } .carousel { scroll-behavior: auto !important; } }

.tabbar { position: sticky; bottom: 0; z-index: 5; flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--bar); border-top: 1px solid var(--raised); padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); }
.tab { min-height: 52px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
.tab[aria-current="page"] { color: var(--fg); font-weight: 700; }
.tab[aria-current="page"]::after { content: ""; width: 18px; height: 3px; border-radius: 3px; background: var(--accent); }
.footer { position: sticky; bottom: var(--tabh, 0px); z-index: 5; flex: 0 0 auto; background: var(--bar); border-top: 1px solid var(--raised); padding-block: 14px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.back { min-height: 44px; margin-left: -8px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; border: none; background: none; font-size: 16px; font-weight: 600; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
.sub { font-size: 15px; color: var(--muted); }
.small { font-size: 14px; color: var(--muted); }
.title { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.4px; }
.h2 { font-size: 18px; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 4px; }

.card { background: var(--card); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.inset { background: var(--raised); border-radius: 18px; padding: 16px; }

.btn { min-height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; border: none; padding: 0 18px; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-quiet { background: var(--raised); color: var(--fg); font-weight: 600; }
.btn-outline { background: transparent; border: 1.5px solid var(--control); color: var(--fg); font-weight: 600; }
.btn-dashed { background: transparent; border: 1.5px dashed var(--control); color: var(--fg); font-weight: 600; }
.btn-text { min-height: 44px; background: none; border: none; font-size: 15px; font-weight: 600; text-decoration: underline; }
.pill { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; background: transparent; border: 1.5px solid var(--control); }
.pill[aria-pressed="true"], .opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 14px; border: none; background: var(--raised); display: flex; align-items: center; justify-content: center; }
.round { width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--control); background: transparent; font-size: 22px; line-height: 1; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: var(--card); }
.seg button { min-height: 48px; border: 1.5px solid transparent; border-radius: 14px; background: transparent; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }

.status { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.good { color: var(--good); }
.warn { color: var(--warn); }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

.rows li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.rows li .t { color: var(--muted); }
.link-card { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--card); border-radius: 20px; border: none; text-align: left; width: 100%; }
.badge { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 14px; background: var(--raised); display: flex; align-items: center; justify-content: center; }

.step { background: var(--card); border-radius: 20px; padding: 12px 12px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.step-row { display: flex; align-items: center; gap: 8px; }
.legs li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.leg-n { width: 28px; height: 28px; border-radius: 8px; background: var(--raised); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--info); }
.addon { width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 16px; background: var(--raised); border: 1.5px solid transparent; text-align: left; }
.addon[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tag { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--control); font-size: 14px; font-weight: 600; }
.addon[aria-pressed="true"] .tag { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }

.tl li { display: grid; grid-template-columns: 52px 28px 1fr; gap: 10px; align-items: start; padding: 10px 0; }
.tl .subs li { display: block; padding: 0; }
.tl-tight li { grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; row-gap: 4px; }
.tl-tight > li { position: relative; }
.tl-tight > li:not(:last-child)::before { content: ''; position: absolute; left: 9.5px; top: 38px; bottom: -6px; width: 3px; border-radius: 3px; background: var(--line); }
.tl-tight li > :nth-child(1) { grid-column: 2; grid-row: 1; padding-top: 0 !important; font-weight: 600; }
.tl-tight li > :nth-child(2) { grid-column: 1; grid-row: 1 / span 2; margin-top: 0; }
.tl-tight li > :nth-child(3) { grid-column: 2; grid-row: 2; }
/* Today timeline: time sits above each step, rail on the left */
.tl-rows > li { grid-template-columns: 28px minmax(0, 1fr) !important; column-gap: 10px !important; row-gap: 4px; }
.tl-rows > li > :nth-child(1) { grid-column: 2; grid-row: 1; padding-top: 0 !important; }
.tl-rows > li > :nth-child(2) { grid-column: 1; grid-row: 1 / span 2; }
.tl-rows > li > :nth-child(3) { grid-column: 2; grid-row: 2; }
.tl-tight .btn { padding-left: 10px; padding-right: 10px; }
.dot { margin-top: 2px; width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--control); background: var(--bg); }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.now { border: 6px solid var(--accent); }
.dot.seat { border-color: var(--accent); color: var(--accent); }
.auto { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--info); }

.check { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 18px; border: none; background: var(--card); text-align: left; }
.check[aria-pressed="true"] { background: var(--bar); }
.box { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--control); display: flex; align-items: center; justify-content: center; }
.check[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); }
.check[aria-pressed="true"] .lbl { color: var(--muted); }
.lbl { font-size: 17px; font-weight: 600; }
.state { margin-left: auto; flex: 0 0 auto; font-size: 13px; font-weight: 600; color: var(--muted); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--muted); }
.field input { min-height: 48px; border-radius: 14px; border: 1.5px solid var(--control); background: var(--bg); padding: 0 14px; font-size: 16px; }
.field input:focus-visible { border-color: var(--accent); }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: flex-end; z-index: 20; }
.sheet { background: var(--card); border-radius: 28px 28px 0 0; padding-block: 12px calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up 220ms ease-out; max-height: 92%; overflow-y: auto; }
@keyframes up { from { transform: translateY(40px); opacity: 0.5; } to { transform: none; opacity: 1; } }
@keyframes toastin { from { transform: translate(-50%, 20px); opacity: 0.5; } to { transform: translate(-50%, 0); opacity: 1; } }
.grab { align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--control); }
.amounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.amounts button { min-height: 56px; border-radius: 16px; font-size: 18px; font-weight: 700; background: transparent; border: 1.5px solid var(--control); }
.amounts button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.calm { background: var(--raised); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }

/* alarm: one steady block of colour, never flashes */
.alarm-view { background: var(--bg); }
.alarm { flex: 1 1 auto; border-radius: 32px; background: var(--accent); color: var(--on-accent); padding: 28px 22px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 560px; }
.alarm .big { font-size: clamp(80px, 25vw, 104px); font-weight: 700; letter-spacing: -3px; white-space: nowrap; line-height: 0.95; margin-left: -4px; }
.alarm .what { font-size: 28px; font-weight: 700; line-height: 1.2; }
.alarm .b { min-height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; border: none; color: var(--on-accent); }
.alarm .b1 { background: var(--on-accent); color: var(--accent); }
.alarm .b2 { background: transparent; border: 2px solid var(--on-accent); }
.alarm .b3 { min-height: 44px; background: none; font-size: 16px; font-weight: 600; text-decoration: underline; }

.lock { background: #08080A; }
.island { align-self: center; min-height: 37px; width: 250px; max-width: 100%; padding: 0 14px; border-radius: 999px; background: #000; border: none; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; }
.clock { text-align: center; }
.clock .big { font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -3px; }
.steps5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.steps5 li { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.steps5 li .mk { width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--control); }
.steps5 li.d .mk { background: var(--good); border-color: var(--good); }
.steps5 li.n .mk { border: 6px solid var(--accent); }
.steps5 li.n { color: var(--fg); }
.note { padding: 10px 14px; border-radius: 14px; background: var(--raised); font-size: 14px; color: var(--soft); }

.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.outcomes button, .opt { min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 20px; font-size: 16px; font-weight: 700; background: var(--card); border: 2px solid var(--line); }
.outcomes button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.opt { min-height: 64px; flex-direction: row; justify-content: flex-start; padding: 0 16px; gap: 12px; text-align: left; font-size: 15px; }
.feel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.feel button { min-height: 52px; border-radius: 16px; font-size: 18px; font-weight: 700; background: transparent; border: 1.5px solid var(--control); }
.feel button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; margin: 0 -20px; padding: 0 20px 4px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 86%; scroll-snap-align: center; min-height: 220px; border-radius: 26px; background: var(--card); border: 2px solid var(--line); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.slide.picked { border-color: var(--accent); background: var(--accent-soft); }
.slide .kind { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
.slide .words { font-size: 26px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots span { width: 8px; height: 8px; border-radius: 999px; border: 1.5px solid var(--control); }
.dots span.on { background: var(--fg); border-color: var(--fg); width: 18px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 15px; font-weight: 700; z-index: 30; animation: toastin 200ms ease-out; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
</style>

<div id="app"></div>

<script>
(function () {
  // ---------- icons ----------

    car: I('<path d="M5 17h14M5 17v2M19 17v2M3 13l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="14" r="1"/><circle cx="16.5" cy="14" r="1"/>', 22),
    door: I('<path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18"/><circle cx="15" cy="12" r="1"/>', 22)
  };
  // prompt level chip and its dropdown, used on Today and Journey headers

        <button class="link-card" data-go="plan"><span class="badge" style="color:var(--warn)">${ic.home}</span><span class="stack-sm" style="flex:1 1 auto;gap:2px"><span style="font-weight:600">Leave work by 17:05</span><span class="small">Daycare pickup by 18:00 · includes packing up</span></span><span style="color:var(--muted)">${ic.chev}</span></button>
        <button class="btn btn-quiet" data-go="calendar">${ic.cal}Plan the week ahead</button>
        <button class="btn btn-dashed" data-act="quickAdd">${ic.plus}Add an event from a text message</button>
        <button class="btn-text" data-go="welcome" style="align-self:center">Set up your routine again</button>
      </section>` };
  }

  function alarm() {
    return { cls: 'alarm-view', body: `
      <section class="alarm" role="alertdialog" aria-labelledby="al-h" aria-describedby="al-d">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-8px -8px 0 0"><p style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700">${ic.bell}Never Late · Alarm</p><button data-act="alarmOff" aria-label="Turn off alarm" style="min-width:44px;min-height:44px;border-radius:999px;border:2px solid var(--on-accent);background:none;color:var(--on-accent);display:flex;align-items:center;justify-content:center">${ic.x}</button></div>
        <p class="big num">07:00</p>
        <h1 id="al-h" class="what">Time to start getting ready</h1>
        <p id="al-d" style="font-size:16px;font-weight:500;line-height:1.4">Workshop in Manchester at 10:00. You have up to 60 minutes. Leave the house at 08:00.</p>
        <span style="flex:1 1 auto"></span>
        <button class="b b1" data-go="journey">Start getting ready</button>
        <button class="b b2" data-act="alarmMore">${ic.timer}I need more time</button>
        <div style="display:flex;justify-content:space-between;gap:8px"><button class="b b3" data-act="snooze">Snooze 5 min</button><button class="b b3" data-act="alarmOff">Turn off alarm</button></div>
      </section>
      <p class="small" style="text-align:center">The colour stays steady and never flashes. Sound and vibration follow your prompt level.</p>` };
  }

  function plan() {
    const st = S.plan, p = PRESETS[st.preset];
    const addonMins = ADDONS.reduce((n, a) => n + (st.addons[a.id] ? a.mins : 0), 0);
    const after = st.steps.reduce((n, s) => n + s.mins, 0);
    let t = p.start - after;
    const ready = t - st.max - addonMins;
    const slack = st.max - st.min;
    const steps = st.steps.map((s, i) => {
      const start = fmt(t); t += s.mins;
      const legs = s.legs ? `
        <button class="btn-outline" style="align-self:flex-start;min-height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600" aria-expanded="${st.legsOpen}" data-act="legs">${st.legsOpen ? 'Hide' : 'Show'} ${s.legs.length} legs ${st.legsOpen ? ic.up : ic.down}</button>
        ${st.legsOpen ? `<ul class="legs" aria-label="Travel legs">${s.legs.map((l, k) => `<li><span class="leg-n" aria-hidden="true">${k + 1}</span><span>${esc(l[0])}</span><span class="small num">${l[1]} min</span></li>`).join('')}</ul><p class="small">Live times from Google Maps</p>` : ''}` : '';
      return `<li class="step"><div class="step-row">
        <span class="stack-sm" style="flex:1 1 auto;min-width:0;gap:2px"><span style="font-weight:600">${esc(s.name)}</span><span class="small">${s.mins} min · ${s.fixed ? 'at your seat ' : 'starts '}${start}</span></span>
        ${s.fixed ? `<span class="small" style="display:flex;align-items:center;gap:4px">${ic.seat}Always kept</span>` : `
        <button class="icon-btn" aria-label="Move ${esc(s.name)} up" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>${ic.up}</button>
        <button class="icon-btn" aria-label="Move ${esc(s.name)} down" data-act="down" data-i="${i}" ${i >= st.steps.length - 2 ? 'disabled' : ''}>${ic.down}</button>
        <button class="icon-btn" aria-label="Remove ${esc(s.name)}" data-act="rm" data-i="${i}">${ic.x}</button>`}
      </div>${legs}</li>`;
    }).join('');
    const stepper = (id, label, val) => `<div class="inset" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px">
        <span class="eyebrow" style="font-size:12px">${label}</span>
        <span class="num" aria-live="polite" style="font-size:22px;font-weight:700;white-space:nowrap">${val} min</span>
        <div style="display:flex;align-items:center;gap:12px">
          <button class="round" aria-label="Decrease ${label.toLowerCase()} by 5 minutes" data-act="${id}Down">−</button>
          <button class="round" aria-label="Increase ${label.toLowerCase()} by 5 minutes" data-act="${id}Up">+</button>
        </div></div>`;
    return {
      body: `
      <header class="stack">
        ${backBtn('today', 'Today')}
        <div class="stack-sm"><h1 class="title">Plan this event</h1><p class="sub">${esc(p.event)}</p></div>
      </header>
      <section class="stack" aria-labelledby="preset-h">
        <h2 id="preset-h" class="h2">Preset</h2>
        <div class="wrap" role="group" aria-labelledby="preset-h">${Object.keys(PRESETS).filter((k) => !PRESETS[k].oneOff || k === st.preset).map((k) => `<button class="pill" aria-pressed="${k === st.preset}" data-act="preset" data-k="${k}">${k === st.preset ? ic.tick : ''}${esc(PRESETS[k].label)}</button>`).join('')}<button class="pill" style="border-style:dashed" data-act="newPreset" data-k="preset">${ic.plus}New preset</button><button class="pill" style="border-style:dashed" data-act="newPreset" data-k="bespoke">${ic.plus}Bespoke, just this once</button></div>
      </section>
      <section class="card" aria-labelledby="ready-h">
        <div class="stack-sm"><h2 id="ready-h" class="h2">Getting ready</h2><p class="small">We plan for the maximum, so anything less is spare time.</p></div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${stepper('min', 'Minimum', st.min)}${stepper('max', 'Maximum', st.max)}</div>
        <div class="stack" style="gap:8px"><p class="small" style="font-weight:600">Add-ons for this event</p>
          ${ADDONS.map((a) => `<button class="addon" aria-pressed="${!!st.addons[a.id]}" data-act="addon" data-k="${a.id}"><span class="stack-sm" style="gap:2px"><span style="font-weight:600">${a.label}</span><span class="small">+${a.mins} min</span></span><span class="tag">${st.addons[a.id] ? ic.tick + 'Added' : ic.plus.replace('width="20" height="20"', 'width="14" height="14"') + 'Add'}</span></button>`).join('')}
        </div>
      </section>
      <section class="stack" aria-labelledby="steps-h">
        <div class="stack-sm"><h2 id="steps-h" class="h2">After getting ready</h2><p class="small">Use the arrows to reorder. Steps tied to a place tick themselves off when your phone gets there.</p></div>
        <ol class="stack" style="gap:10px">${steps}</ol>
        <button class="btn btn-dashed" data-act="addStep">${ic.plus}Add a step</button>
      </section>`,
      footer: `<div style="display:flex;align-items:center;gap:14px">
        <div class="stack-sm" style="flex:1 1 auto;gap:2px"><span class="small" style="font-size:13px">Start getting ready</span><span class="num" aria-live="polite" style="font-size:24px;font-weight:700">${fmt(ready)}</span><span class="small" style="font-size:13px">${slack > 0 ? `Up to ${slack} min spare if you’re quick` : 'No spare time in this plan'}</span></div>
        <button class="btn btn-primary" data-act="save">Save plan</button></div>`
    };
  }

  function journey() {
    const extra = S.j.extra, canWin = 10, late = extra > canWin;
    const trims = []; let left = extra;
    [['Spare time leaving the house', 2], ['Spare time at the station', 8]].forEach(([n, m]) => { if (left > 0) { const t = Math.min(m, left); trims.push([n, t]); left -= t; } });
    const leave = 480 + extra, now = 458, seat = late ? '10:10' : '09:55', lateBy = 10;
    const pct = Math.round(((now - 420) / (60 + extra)) * 100);
    const tl = [
      ['07:00', 'Getting ready', 'Now · up to 60 min' + (extra ? ' +' + extra : ''), 'now'],
      [fmt(leave), 'Leave the house', (extra && !late ? 'Checklist · trimmed to 8 min' : 'Checklist · 10 min'), '', 'Ticks itself when you leave home'],
      ['08:10', 'Travel', 'Taxi, then the 08:31 train · ' + (late ? 'next train 08:46' : 'live times from Google Maps'), '', 'Ticks itself at the station'],
      [late ? '09:51' : '09:36', 'Walk to the venue', '10 min', '', 'Ticks itself near the venue'],
      [late ? '10:01' : '09:46', 'Check in and find your seat', '9 min', ''],
      [seat, 'At your seat', late ? 'Straight in, no time to yourself' : '5 minutes to yourself before 10:00', 'seat']
    ];
    const lvl = LEVELS.find((l) => l.id === S.level);
    const sheet = !S.j.sheet ? '' : `
      <div class="scrim" data-act="closeSheetBg">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="more-h">
          <span class="grab" aria-hidden="true"></span>
          <div class="top"><h2 id="more-h" style="font-size:22px;font-weight:700">How much more time?</h2><button class="icon-btn" style="border-radius:999px" aria-label="Close" data-act="closeSheet">${ic.x}</button></div>
          <div class="amounts" role="group" aria-label="Extra time">${[5, 10, 15, 20].map((n) => `<button aria-pressed="${n === extra}" data-act="extra" data-n="${n}">+${n}</button>`).join('')}</div>
          ${extra ? (late ? `${calmLate(lateBy, seat)}
            <p class="small">We won back 10 minutes from spare time, but that misses the 08:31 train. The next one is at 08:46.</p>
            <button class="btn btn-outline" style="min-height:48px;font-size:15px" aria-expanded="${S.j.draft}" data-act="draft">${ic.msg}Draft a “running late” message</button>
            ${S.j.draft ? `<div class="stack" style="gap:8px"><p id="draft-text" style="padding:12px 14px;border-radius:14px;background:var(--bg);font-size:15px;line-height:1.4">Hi, I’m running about ${lateBy} minutes late for the workshop. I’ll be there for ${seat}. Sorry!</p><button class="btn btn-outline" style="min-height:44px;font-size:15px" data-act="copy">Copy message</button></div>` : ''}`
            : `<div class="calm" aria-live="polite"><p class="status good" style="font-size:16px;font-weight:700">${ic.ok}Still on time. Here’s what we trimmed:</p>
              <ul class="stack" style="gap:6px">${trims.map((t) => `<li style="display:flex;justify-content:space-between;gap:12px;font-size:15px"><span>${t[0]}</span><span class="num" style="font-weight:700">−${t[1]} min</span></li>`).join('')}</ul>
              <p class="small">Travel and your 5 minutes at your seat are never cut.</p></div>`) : ''}
          <button class="btn btn-primary" data-act="${extra ? 'applyExtra' : 'closeSheet'}">${extra ? 'Update my plan' : 'Cancel'}</button>
        </section>
      </div>`;
    // demo clock: 22 min left when the screen first opens, then counts down for real
    if (!S.j.base) S.j.base = Date.now() + (leave - now - extra) * 60000;
    const jEnd = S.j.base + extra * 60000;
    const subs = CATS.filter((c) => c.phase === 'Getting ready').flatMap((c) => c.items).filter((it) => S.ob.sel[it[0]]);
    const nowCard = `<section class="card" aria-label="Now: Getting ready" style="padding:18px;gap:12px;background:var(--accent-soft);border:1.5px solid var(--accent)"><div class="top"><h2 style="font-size:20px;font-weight:700">Getting ready</h2><span class="eyebrow" style="color:var(--accent)">Now</span></div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
          <div class="stack-sm" style="gap:4px"><span class="num" style="font-size:52px;line-height:1;font-weight:700;letter-spacing:-1.5px;white-space:nowrap"><span data-cd="${jEnd}" data-fmt="hms">${hms(jEnd - Date.now())}</span><span style="font-size:20px;letter-spacing:0;font-weight:600;color:var(--soft)"> left</span></span><span class="sub">Leave at <strong class="num" style="color:var(--fg)">${fmt(leave)}</strong></span></div>
        </div>
        <div class="bar" style="background:var(--card)" aria-hidden="true"><span style="width:${pct}%"></span></div>
        ${statusLine(late, late ? `About ${lateBy} min late · at your seat by ${seat}` : `On track · at your seat by ${seat}`)}
        <ul class="stack subs" aria-label="Getting ready steps" style="gap:6px">${subs.map((it) => { const on = !!S.subDone[it[0]]; return `<li style="width:100%"><button class="check" aria-pressed="${on}" data-act="subToggle" data-k="${it[0]}" style="min-height:48px;padding:8px 12px;gap:10px;border-radius:14px;background:var(--card)"><span class="box" aria-hidden="true" style="width:24px;height:24px;border-radius:8px">${on ? ic.tickDark : ''}</span><span style="flex:1 1 auto;font-size:15px;${on ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(it[1])}</span><span class="small num" style="white-space:nowrap">${it[2]} min</span></button></li>`; }).join('')}</ul>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
          <button class="btn btn-primary" data-go="leave">${ic.tickDark}Ready</button>
          <button class="btn btn-outline" data-act="openSheet" style="background:var(--card);white-space:nowrap">${ic.timer}Add time</button>
        </div>
      </section>`;
    return {
      body: `
      <header class="top" style="position:relative">${backBtn('today', 'Today')}${levelChip()}</header>
      <div class="stack-sm"><p class="sub">Thursday 30 October · starts 10:00</p><h1 class="title">Workshop in Manchester</h1></div>
      <section class="stack" aria-labelledby="tl-h" style="gap:6px">
        <h2 id="tl-h" class="h2">Your plan</h2>
        <ol class="tl tl-tight">${tl.map((t) => `<li><span class="small num" style="font-size:15px;padding-top:2px">${t[0]}</span><span class="dot ${t[3]}" aria-hidden="true">${t[3] === 'done' ? ic.tickDark : t[3] === 'seat' ? ic.seat : ''}</span>${t[3] === 'now' ? `<div style="min-width:0">${nowCard}</div>` : `<span class="stack-sm" style="gap:2px"><span style="font-weight:${t[3] === 'now' ? 700 : 500};color:${t[3] === 'done' ? 'var(--muted)' : 'var(--fg)'}">${t[1]}<span class="sr">${t[3] === 'now' ? ' (now)' : t[3] === 'done' ? ' (done)' : ''}</span></span><span class="small">${t[2]}</span>${t[4] ? `<span class="auto">${ic.pin}${t[4]}</span>` : ''}</span>`}</li>`).join('')}</ol>
      </section>`,
      overlay: sheet
    };
  }

  function leave() {
    const t = S.leave, done = CHECKLIST.filter((c) => t[c.id]).length, all = done === CHECKLIST.length;
    return {
      body: `
      <header class="stack">${backBtn('journey', 'Journey')}<div class="stack-sm"><p class="sub">Leave by 08:00 · taxi booked for 08:00</p><h1 class="title">Before you go</h1></div></header>
      <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1 1 auto" aria-hidden="true"><span style="width:${Math.round(done / CHECKLIST.length * 100)}%;background:var(--good)"></span></div><span class="num" aria-live="polite" style="font-size:15px;font-weight:600">${done} of ${CHECKLIST.length}</span></div>
      <ul class="stack" style="gap:8px">${CHECKLIST.map((c) => `<li><button class="check" aria-pressed="${!!t[c.id]}" data-act="tick" data-k="${c.id}"><span class="box" aria-hidden="true">${t[c.id] ? ic.tickDark.replace(/14/g, '18') : ''}</span><span class="stack-sm" style="gap:2px"><span class="lbl">${c.label}</span>${c.note ? `<span class="small">${c.note}</span>` : ''}</span><span class="state" aria-hidden="true">${t[c.id] ? 'Done' : ''}</span></button></li>`).join('')}</ul>
      ${all ? `<p class="card" role="status" style="flex-direction:row;align-items:center;gap:10px;padding:14px 16px;font-size:15px"><span class="good">${ic.shield}</span><span>Saved at 07:59. You can check this record later if you’re worried.</span></p>`
            : `<p class="note" style="display:flex;gap:8px;align-items:flex-start"><span style="color:var(--info);margin-top:2px">${ic.pin}</span><span>If you leave home with items unticked, we’ll ask “Did you lock up and take your keys?”</span></p>`}`,
      footer: `<button class="btn btn-primary" data-act="left">I’ve left the house</button><p class="small" style="text-align:center;font-size:13px">Tonight we’ll remind you to put your bag, coat and keys by the door.</p>`
    };
  }

  function evening() {
    const t = S.eve, done = EVENING.filter((c) => t[c.id]).length;
    return {
      body: `
      <header class="stack">${backBtn('today', 'Today')}<div class="stack-sm"><p class="sub">Tonight, 21:00 · for Friday 09:30</p><h1 class="title">Get ahead for tomorrow</h1><p class="sub">Training in Chester, at a venue you haven’t been to before. Ten minutes now saves a rush in the morning.</p></div></header>
      <section class="stack" aria-labelledby="ev-h">
        <div class="top"><h2 id="ev-h" class="h2">Things you can do now</h2><span class="num small" aria-live="polite" style="font-weight:600">${done} of ${EVENING.length}</span></div>
        <ul class="stack" style="gap:8px">${EVENING.map((c) => `<li><button class="check" aria-pressed="${!!t[c.id]}" data-act="eve" data-k="${c.id}"><span class="box" aria-hidden="true">${t[c.id] ? ic.tickDark.replace(/14/g, '18') : ''}</span><span class="stack-sm" style="gap:2px"><span class="lbl">${c.label}</span>${c.note ? `<span class="small">${c.note}</span>` : ''}</span><span class="state" aria-hidden="true">${t[c.id] ? 'Done' : ''}</span></button></li>`).join('')}</ul>
      </section>
      <section class="card" aria-labelledby="venue-h">
        <div class="stack-sm"><h2 id="venue-h" class="h2">Check the venue</h2><p class="small">We’ll save these so you don’t have to look them up again.</p></div>
        <div class="field"><label for="v-addr">Address</label><input id="v-addr" value="[Venue address], Chester"></div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
          <div class="field"><label for="v-floor">Floor</label><input id="v-floor" placeholder="e.g. 2"></div>
          <div class="field"><label for="v-room">Room</label><input id="v-room" placeholder="e.g. Room 4B"></div>
        </div>
        <div class="field"><label for="v-park">Parking and entrance</label><input id="v-park" placeholder="e.g. Pay at machine, side entrance"></div>
      </section>`,
      footer: `<button class="btn btn-primary" data-act="eveDone">Done for tonight</button>`
    };
  }

  function lock() {
    const extra = S.lock.extra, used = Math.min(extra, 5), lateBy = Math.max(0, extra - 5), late = lateBy > 0;
    const lvl = LEVELS.find((l) => l.id === S.level);
    let status = 'On track · at your seat by 09:55';
    if (extra && !late) status = 'Still on time · uses your 5 minutes at your seat';
    if (late) status = `About ${lateBy} min late · at your seat by ${fmt(595 + extra)}`;
    const steps = [['Ready', 'd'], ['Leave', 'd'], ['Travel', 'n'], ['Walk', ''], ['Seat', '']];
    return {
      cls: 'lock',
      body: `
      <button class="island" data-go="journey" aria-label="Never Late: train arrives 09:36, ${late ? lateBy + ' minutes late' : 'on track'}. Open the app"><span style="display:flex;align-items:center;gap:6px;color:var(--fg)"><span style="color:var(--info)">${ic.train}</span>09:36</span><span class="${late ? 'warn' : 'good'}" style="display:flex;align-items:center;gap:4px">${(late ? ic.late : ic.ok).replace(/width="20" height="20"/, 'width="14" height="14"')}${late ? lateBy + ' min late' : 'On track'}</span></button>
      <div class="clock"><p style="font-size:19px;font-weight:600;color:var(--soft)">Thursday 30 October</p><p class="big num">08:41</p><p class="small" style="margin-top:6px">Preview of your lock screen</p></div>
      <div style="flex:1 1 auto"></div>
      <section class="card" aria-label="Never Late live activity" style="border-radius:28px;padding:18px;gap:14px">
        <div class="top"><span class="eyebrow" style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">${I('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>', 14, 3)}</span>Never Late</span><span class="small" style="font-size:13px">Workshop · 10:00</span></div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div class="stack-sm" style="gap:2px"><span style="font-size:22px;font-weight:700">On the train</span><span style="font-size:15px;color:var(--soft)">Arrives Manchester 09:36</span></div><span class="num" style="font-size:28px;font-weight:700">55<span class="small" style="font-size:15px;font-weight:600"> min</span></span></div>
        <ol class="steps5" aria-label="Progress">${steps.map((s) => `<li class="${s[1]}"><span class="mk" aria-hidden="true">${s[1] === 'd' ? ic.tickDark : ''}</span>${s[0]}<span class="sr">${s[1] === 'd' ? ', done' : s[1] === 'n' ? ', now' : ', to come'}</span></li>`).join('')}</ol>
        ${statusLine(late, status)}
        ${S.lock.more ? `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px" role="group" aria-label="Extra time">${[5, 10, 15].map((n) => `<button class="pill" style="justify-content:center;min-height:48px;border-radius:14px;padding:0" aria-pressed="${n === extra}" data-act="lockExtra" data-n="${n}">+${n} min</button>`).join('')}</div>` : ''}
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <button class="btn btn-quiet" style="min-height:48px;font-size:15px" aria-expanded="${S.lock.more}" data-act="lockMore">${ic.timer}More time</button>
          <button class="btn btn-quiet" style="min-height:48px;font-size:15px" aria-label="Prompts: ${lvl.label}. Tap to switch level" data-act="cycle">${vol(S.level)}${lvl.label}</button>
        </div>
      </section>
      ${late ? `<div class="calm" role="status" style="background:var(--card)"><p style="font-size:15px;line-height:1.4"><strong>Don’t panic.</strong> New time at your seat: <strong class="num">${fmt(595 + extra)}</strong>. Let them know, then just focus on getting there.</p></div>` : `<section class="card" aria-label="Last spoken prompt" style="flex-direction:row;align-items:flex-start;gap:12px;border-radius:22px;padding:14px 16px"><span style="color:var(--muted)">${ic.ear}</span><span class="stack-sm" style="gap:2px"><span class="small" style="font-size:13px">Spoken at 08:32 through AirPods</span><span style="font-size:15px;line-height:1.35">“You’re on the 08:31. On track to arrive at 09:36.”</span></span></section>`}
      <div class="top"><button class="back" data-go="journey" style="margin-left:0;font-size:14px">Open the app</button><button class="back" data-go="seat" style="font-size:14px;color:var(--accent)">Skip to your seat</button></div>`
    };
  }

  function seat() {
    const st = S.seat;
    const picked = st.picked >= 0 ? SLIDES[st.picked] : null;
    return {
      body: `
      <header class="stack">${backBtn('lock', 'Journey')}
        <div class="stack-sm"><p class="status good">${ic.seat.replace(/width="14" height="14"/, 'width="20" height="20"')}At your seat · 09:55</p><h1 class="title">5 minutes to yourself</h1><p class="sub">The workshop starts at 10:00. Swipe through and pick what suits today.</p></div>
      </header>
      <section aria-roledescription="carousel" aria-label="Ways to spend 5 minutes" class="stack">
        <div class="carousel" id="carousel">${SLIDES.map((s, i) => `<article class="slide${i === st.picked ? ' picked' : ''}" aria-roledescription="slide" aria-label="${i + 1} of ${SLIDES.length}" data-i="${i}">
          <span style="color:var(--accent)">${ic[s.icon]}</span>
          <span class="kind">${s.kind}</span>
